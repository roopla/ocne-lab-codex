apiVersion: apps/v1
kind: Deployment
metadata:
  name: board-frontend
  namespace: rac-app
  labels: &id001
    app.kubernetes.io/part-of: rac-lab-board
    app.kubernetes.io/name: board-frontend
spec:
  replicas: 2
  revisionHistoryLimit: 2
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 0
      maxUnavailable: 1
  selector:
    matchLabels: &id002
      app.kubernetes.io/name: board-frontend
  template:
    metadata:
      labels: *id001
    spec:
      automountServiceAccountToken: false
      terminationGracePeriodSeconds: 30
      nodeSelector:
        raccluster: raccluster01
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        runAsGroup: 10001
        fsGroup: 10001
        seccompProfile:
          type: RuntimeDefault
      topologySpreadConstraints:
      - maxSkew: 1
        topologyKey: kubernetes.io/hostname
        whenUnsatisfiable: ScheduleAnyway
        labelSelector:
          matchLabels: *id002
      containers:
      - name: frontend
        image: localhost/rac-board-frontend:1.0.0
        imagePullPolicy: Never
        ports:
        - containerPort: 8080
          name: http
        env:
        - name: GATEWAY_URL
          value: http://board-gateway:8081
        - name: PORT
          value: '8080'
        - name: POD_NAME
          valueFrom:
            fieldRef:
              fieldPath: metadata.name
        resources:
          requests:
            cpu: 25m
            memory: 32Mi
          limits:
            cpu: 250m
            memory: 64Mi
        securityContext:
          allowPrivilegeEscalation: false
          readOnlyRootFilesystem: true
          capabilities:
            drop:
            - ALL
        volumeMounts:
        - name: tmp
          mountPath: /tmp
        startupProbe:
          httpGet:
            path: /livez
            port: http
          periodSeconds: 2
          failureThreshold: 60
        livenessProbe:
          httpGet:
            path: /livez
            port: http
          periodSeconds: 10
          timeoutSeconds: 2
          failureThreshold: 3
        readinessProbe:
          httpGet:
            path: /readyz
            port: http
          periodSeconds: 10
          timeoutSeconds: 12
          failureThreshold: 2
      volumes:
      - name: tmp
        emptyDir:
          sizeLimit: 64Mi
---
apiVersion: v1
kind: Service
metadata:
  name: board-frontend
  namespace: rac-app
  labels:
    app.kubernetes.io/part-of: rac-lab-board
    app.kubernetes.io/name: board-frontend
spec:
  selector:
    app.kubernetes.io/name: board-frontend
  ports:
  - name: http
    port: 8080
    targetPort: http
    nodePort: 30080
  type: NodePort
---
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: board-frontend
  namespace: rac-app
  labels:
    app.kubernetes.io/part-of: rac-lab-board
    app.kubernetes.io/name: board-frontend
spec:
  minAvailable: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: board-frontend
---
