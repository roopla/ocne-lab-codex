# Local implementation: Windows SSH over verified VirtualBox NAT forwarding
Host ocne-op ocne-op.lab.test
    HostName 127.0.0.1
    Port 2220
    User labadmin
    IdentityFile D:/OCNE19-Lab/private/workstation_ed25519
    IdentitiesOnly yes
    HostKeyAlias ocne-op.lab.test
    UserKnownHostsFile D:/OCNE19-Lab/private/windows_known_hosts
    StrictHostKeyChecking yes

