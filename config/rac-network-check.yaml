apiVersion: v1
kind: Pod
metadata:
  name: rac-netcheck-w1
  namespace: rac
  labels:
    app: ocne-rac-netcheck
  annotations:
    k8s.v1.cni.cncf.io/networks: '[{"name":"macvlan-conf1","interface":"ens1","ips":["192.168.78.128/24"]},{"name":"macvlan-conf2","interface":"ens2","ips":["192.168.79.128/24"]}]'
spec:
  automountServiceAccountToken: false
  restartPolicy: Never
  containers:
  - name: network-check
    image: docker.io/library/busybox:1.37.0
    command:
    - sleep
    - '1800'
    securityContext:
      allowPrivilegeEscalation: false
      capabilities:
        add:
        - NET_RAW
    resources:
      requests:
        cpu: '4'
        memory: 16Gi
        hugepages-2Mi: 2Gi
      limits:
        cpu: '4'
        memory: 16Gi
        hugepages-2Mi: 2Gi
    volumeMounts:
    - name: hugepages
      mountPath: /hugepages
  nodeSelector:
    kubernetes.io/hostname: ocne-w1.lab.test
  securityContext:
    sysctls:
    - name: kernel.shmmax
      value: '2147483648'
    - name: kernel.shmall
      value: '524288'
    - name: kernel.sem
      value: 250 32000 100 128
    - name: net.ipv4.conf.all.rp_filter
      value: '2'
  volumes:
  - name: hugepages
    emptyDir:
      medium: HugePages
---
